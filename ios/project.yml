# Proiect Xcode generat cu XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd ios && xcodegen
# Fișierul .xcodeproj nu e versionat — se regenerează din acest fișier.
name: HistoryOfWorldCup
options:
  bundleIdPrefix: com.puiutpavel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WorldCupCore:
    path: WorldCupCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HistoryOfWorldCup:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: WorldCupCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "History of World Cup"
        # versiunea vine din setările de build (TestFlight suprascrie CURRENT_PROJECT_VERSION cu numărul rulării CI)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puiutpavel.historyofworldcup
        # doar iPhone (pe iPad rulează în modul de compatibilitate iPhone)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  HistoryOfWorldCup:
    build:
      targets:
        HistoryOfWorldCup: all
    run:
      # testare locală a achiziției „Full History” fără App Store Connect (Xcode → Run)
      storeKitConfiguration: App/StoreKit/FullHistory.storekit
