# Proiect Xcode generat cu XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd ios && xcodegen
# Fișierul .xcodeproj nu e versionat — se regenerează din acest fișier.
name: HistoryOfWorldCup
options:
  bundleIdPrefix: com.puiutpavel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WorldCupCore:
    path: WorldCupCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HistoryOfWorldCup:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: WorldCupCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "History of World Cup"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puiutpavel.historyofworldcup
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  HistoryOfWorldCup:
    build:
      targets:
        HistoryOfWorldCup: all
    run:
      # testare locală a achiziției „Full History” fără App Store Connect (Xcode → Run)
      storeKitConfiguration: App/StoreKit/FullHistory.storekit
