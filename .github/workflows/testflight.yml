name: TestFlight

# Construiește aplicația pentru iPhone, o semnează automat (semnare în cloud, prin
# cheia App Store Connect API) și o încarcă în App Store Connect → TestFlight.
# Pornire manuală: GitHub → Actions → TestFlight → Run workflow.
# Pregătire (o singură dată): docs/app-store/TESTFLIGHT.md — cont Apple Developer,
# aplicația creată în App Store Connect și 4 secrete în GitHub:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (conținutul fișierului .p8), APPLE_TEAM_ID.

on:
  workflow_dispatch:

jobs:
  testflight:
    name: Build semnat + upload în TestFlight
    # App Store Connect acceptă doar build-uri cu SDK-ul iOS 26 (Xcode 26 sau mai nou)
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Verifică secretele
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Lipsește secretul $v — vezi docs/app-store/TESTFLIGHT.md"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::Xcode 26 lipsește pe runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Generează JSON-urile din prototipul web
        run: node tools/export_ios_data.js
      - name: Generează iconița aplicației
        run: |
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install -q pillow
          /tmp/icon-venv/bin/python tools/make_icon.py
      - name: Generează proiectul Xcode
        run: brew install xcodegen && cd ios && xcodegen
      - name: Cheia App Store Connect API
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # secretul poate fi conținutul fișierului .p8 copiat ca text sau același conținut în base64
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          fi
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive (Release, semnare automată în cloud)
        run: |
          cd ios
          xcodebuild -project HistoryOfWorldCup.xcodeproj -scheme HistoryOfWorldCup -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/HistoryOfWorldCup.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive > archive.log 2>&1 \
            || { grep -E "error:|error -" archive.log | head -60; tail -40 archive.log; exit 1; }
          tail -5 archive.log
      - name: Export + upload în App Store Connect
        run: |
          cd ios
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/HistoryOfWorldCup.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 \
            || { grep -E "error:|error -" export.log | head -60; tail -40 export.log; exit 1; }
          tail -10 export.log
          echo "### ✅ Build $GITHUB_RUN_NUMBER încărcat în App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Apare în TestFlight după procesare (de obicei 5–30 de minute)." >> "$GITHUB_STEP_SUMMARY"
      - name: Șterge cheia
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
