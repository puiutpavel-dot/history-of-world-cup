name: Pagina App Store

# Completează pagina din App Store a versiunii 1.0 prin App Store Connect API: categorii, nume/subtitlu,
# descriere, cuvinte cheie, text promoțional, linkuri, vârstă 4+, preț gratuit, disponibilitate,
# build, capturi iPhone 6,9" (branch-ul screenshots) și notele pentru App Review. Vezi tools/asc_listing.py.
# Pornire manuală: GitHub → Actions → Pagina App Store → Run workflow. Poate fi rulat de mai multe ori.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Numărul build-ului (gol = cel mai nou build valid)"
        required: false
        default: ""
      copyright:
        description: "Copyright (ex. „2026 Daniel Draghicioiu”)"
        required: false
        default: ""

jobs:
  listing:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.event.inputs.build }}
      COPYRIGHT: ${{ github.event.inputs.copyright }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capturile (branch-ul screenshots)
        run: |
          mkdir -p /tmp/shots
          git --work-tree=/tmp/shots checkout origin/screenshots -- .
          ls /tmp/shots
      - run: pip install -q pyjwt cryptography requests
      - name: Completează pagina
        run: python3 tools/asc_listing.py /tmp/shots
